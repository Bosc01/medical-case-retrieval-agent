name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GPU wheels are several hundred MB larger and
          # nothing in the non-slow suite runs on an accelerator.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
      - name: Tests
        # Model-loading tests are excluded: CI should not pull 1.7GB of weights
        # on every push. They run locally via `pytest -m slow`.
        run: pytest -q -m "not slow"
      - name: Import check
        run: python -c "import medcase; print(len(medcase.__all__), 'exports')"
