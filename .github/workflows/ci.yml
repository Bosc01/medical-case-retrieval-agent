name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        # Model-loading tests are excluded: CI should not pull 1.7GB of weights
        # on every push. They run locally via `pytest -m slow`.
        run: pytest -q -m "not slow"
      - name: Import check
        run: python -c "import medcase; print(medcase.__all__)"
